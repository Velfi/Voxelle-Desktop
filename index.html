<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("voxelle-preferences");
          var mode = "auto";
          if (raw) {
            var p = JSON.parse(raw);
            if (
              p &&
              (p.appearanceTheme === "light" ||
                p.appearanceTheme === "dark" ||
                p.appearanceTheme === "auto")
            ) {
              mode = p.appearanceTheme;
            }
          }
          document.documentElement.setAttribute("data-appearance", mode);
        } catch (e) {
          document.documentElement.setAttribute("data-appearance", "auto");
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxelle Desktop</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
