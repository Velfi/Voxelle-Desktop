name: Dev Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle
            artifact_name: dev-macos-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            bundle_dir: src-tauri/target/x86_64-apple-darwin/release/bundle
            artifact_name: dev-macos-x86_64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            bundle_dir: src-tauri/target/release/bundle
            artifact_name: dev-linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            bundle_dir: src-tauri/target/release/bundle
            artifact_name: dev-windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12

      - name: Build Tauri app (no updater artifacts)
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > dev-override.json
          npm run tauri -- build ${{ matrix.args }} --config dev-override.json

      - name: Collect macOS installer
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          mkdir -p upload
          cp "${{ matrix.bundle_dir }}"/dmg/*.dmg upload/

      - name: Collect Linux installers
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p upload
          cp "${{ matrix.bundle_dir }}"/appimage/*.AppImage upload/ || true
          cp "${{ matrix.bundle_dir }}"/deb/*.deb upload/ || true

      - name: Collect Windows installers
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p upload
          cp "${{ matrix.bundle_dir }}"/msi/*.msi upload/ || true
          cp "${{ matrix.bundle_dir }}"/nsis/*-setup.exe upload/ || true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: upload/
          retention-days: 7
          if-no-files-found: error
