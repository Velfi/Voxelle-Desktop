name: Dev Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact_name: dev-macos-universal
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: ubuntu-22.04
            artifact_name: dev-linux
            bundle_dir: src-tauri/target/release/bundle
          - platform: windows-latest
            artifact_name: dev-windows
            bundle_dir: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Remove Homebrew Rust to prevent rustup conflict (macOS only)
        if: matrix.platform == 'macos-latest'
        run: brew uninstall --ignore-dependencies rust rustup 2>/dev/null || true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Ensure cargo bin takes priority over Homebrew in PATH (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Install relic (Windows code signing)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          go install github.com/sassoftware/relic/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify relic can authenticate with Azure Key Vault
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          relic --version
          RELIC_BIN="$(which relic)"
          cp "$RELIC_BIN" test_sign.exe
          relic sign --file test_sign.exe --key azure --config src-tauri/relic.conf 2>&1 || {
            echo "--- relic sign failed, dumping debug info ---"
            relic sign --file test_sign.exe --key azure --config src-tauri/relic.conf -d 9 2>&1 || true
            exit 1
          }
          rm test_sign.exe

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12

      - name: Build Tauri app (no updater artifacts)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > dev-override.json
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npm run tauri -- build --target universal-apple-darwin --config dev-override.json
          else
            npm run tauri -- build --config dev-override.json
          fi

      - name: Collect macOS installer
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          mkdir -p upload
          cp "${{ matrix.bundle_dir }}"/dmg/*.dmg upload/

      - name: Collect Linux installers
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p upload
          cp "${{ matrix.bundle_dir }}"/appimage/*.AppImage upload/ || true
          cp "${{ matrix.bundle_dir }}"/deb/*.deb upload/ || true

      - name: Collect Windows installers
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p upload
          cp "${{ matrix.bundle_dir }}"/msi/*.msi upload/ || true
          cp "${{ matrix.bundle_dir }}"/nsis/*-setup.exe upload/ || true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: upload/
          retention-days: 7
          if-no-files-found: error
