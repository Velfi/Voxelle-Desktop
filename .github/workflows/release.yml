name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-release (e.g. v0.2.0)"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "Voxelle Desktop ${{ steps.tag.outputs.tag }}" \
            --generate-notes \
          || echo "Release already exists — continuing"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: ubuntu-22.04
            bundle_dir: src-tauri/target/release/bundle
          - platform: windows-latest
            bundle_dir: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Install relic (Windows code signing)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          go install github.com/sassoftware/relic/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Import Apple signing certificate and notarization key
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/.private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Pin RUSTUP_HOME to whatever rustup is currently using so that all
            # subprocesses (including Tauri's internal `rustup target list --installed`
            # checks) read from the same location we write targets to.
            export RUSTUP_HOME="$(rustup show home)"
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            npm run tauri -- build --target universal-apple-darwin
          else
            npm run tauri -- build
          fi

      - name: Rename macOS updater artifact
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          MACOS_DIR="${{ matrix.bundle_dir }}/macos"
          for f in "$MACOS_DIR"/*.app.tar.gz; do
            mv "$f" "${f%.app.tar.gz}_universal.app.tar.gz"
          done
          for f in "$MACOS_DIR"/*.app.tar.gz.sig; do
            mv "$f" "${f%.app.tar.gz.sig}_universal.app.tar.gz.sig"
          done

      - name: Upload release artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.release_tag }}"
          BUNDLE="${{ matrix.bundle_dir }}"
          gh release upload "$TAG" \
            "$BUNDLE"/dmg/*.dmg \
            "$BUNDLE"/macos/*.app.tar.gz \
            "$BUNDLE"/macos/*.app.tar.gz.sig \
            --clobber

      - name: Upload release artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.release_tag }}"
          BUNDLE="${{ matrix.bundle_dir }}"
          gh release upload "$TAG" \
            "$BUNDLE"/appimage/*.AppImage \
            "$BUNDLE"/appimage/*.AppImage.tar.gz \
            "$BUNDLE"/appimage/*.AppImage.tar.gz.sig \
            "$BUNDLE"/deb/*.deb \
            --clobber

      - name: Upload release artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.release_tag }}"
          BUNDLE="${{ matrix.bundle_dir }}"
          gh release upload "$TAG" \
            "$BUNDLE"/msi/*.msi \
            "$BUNDLE"/msi/*.msi.zip \
            "$BUNDLE"/msi/*.msi.zip.sig \
            "$BUNDLE"/nsis/*-setup.exe \
            "$BUNDLE"/nsis/*.nsis.zip \
            "$BUNDLE"/nsis/*.nsis.zip.sig \
            --clobber

  updater-manifest:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
        run: |
          mkdir -p sigs
          gh release download "$RELEASE_TAG" --pattern "*.sig" --dir sigs --clobber

          python3 - <<'EOF'
          import json, os
          from datetime import datetime, timezone

          tag = os.environ['RELEASE_TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          def read_sig(name):
              return open(os.path.join('sigs', name)).read().strip()

          platforms = {}
          for sig_name in os.listdir('sigs'):
              asset_name = sig_name[:-4]  # strip .sig
              asset_url = f"{base_url}/{asset_name}"
              sig = read_sig(sig_name)
              if asset_name.endswith('_universal.app.tar.gz'):
                  # Universal binary serves both Intel and ARM macOS users
                  platforms['darwin-aarch64'] = {'url': asset_url, 'signature': sig}
                  platforms['darwin-x86_64'] = {'url': asset_url, 'signature': sig}
              elif asset_name.endswith('.AppImage.tar.gz'):
                  platforms['linux-x86_64'] = {'url': asset_url, 'signature': sig}
              elif asset_name.endswith('.msi.zip') and not asset_name.endswith('.nsis.zip'):
                  platforms['windows-x86_64'] = {'url': asset_url, 'signature': sig}

          version = tag.lstrip('v')
          manifest = {
              'version': version,
              'notes': '',
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms,
          }
          with open('latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(f"Generated latest.json v{version} — platforms: {sorted(platforms)}")
          EOF

          gh release upload "$RELEASE_TAG" latest.json --clobber
