name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-release (e.g. v0.2.0)"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        shell: bash
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Extract release notes
        shell: bash
        run: node scripts/extract-release-notes.mjs "${{ steps.tag.outputs.tag }}" > release-notes.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "Voxelle Desktop ${{ steps.tag.outputs.tag }}" \
            --notes-file release-notes.md \
          || echo "Release already exists — continuing"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            rust_target: x86_64-apple-darwin
            bundle_dir: src-tauri/target/x86_64-apple-darwin/release/bundle
          - platform: macos-15
            rust_target: aarch64-apple-darwin
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle
          - platform: ubuntu-22.04
            bundle_dir: src-tauri/target/release/bundle
          - platform: windows-latest
            bundle_dir: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target and pin rustup (macOS only)
        if: runner.os == 'macOS'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          "$HOME/.cargo/bin/rustup" target add ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Install relic (Windows code signing)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          go install github.com/sassoftware/relic/v8@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify signing cert exists in Azure Key Vault
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none
          az keyvault certificate show \
            --vault-name voxelledesktop \
            --name VoxelleDesktop \
            --query '{enabled:attributes.enabled,expires:attributes.expires}' \
            --output table

      - name: Verify relic can authenticate with Azure Key Vault
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          relic --version
          RELIC_BIN="$(which relic)"
          cp "$RELIC_BIN" test_sign.exe
          relic sign --file test_sign.exe --key azure --config src-tauri/relic.conf 2>&1 || {
            echo "--- relic sign failed, dumping debug info ---"
            relic sign --file test_sign.exe --key azure --config src-tauri/relic.conf -d 9 2>&1 || true
            exit 1
          }
          rm test_sign.exe

      - name: Import Apple signing certificate and notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/.private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/.private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Patch relic.conf path in signCommand (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          jq --arg cmd "relic sign --file %1 --key azure --config $GITHUB_WORKSPACE/src-tauri/relic.conf" \
            '.bundle.windows.signCommand = $cmd' \
            src-tauri/tauri.conf.json > patched.json
          mv patched.json src-tauri/tauri.conf.json

      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty or not set — updater artifacts will not be generated"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY is set (${#TAURI_SIGNING_PRIVATE_KEY} chars)"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set — this is fine only if the key has no password"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set"
          fi

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npm run tauri -- build --target ${{ matrix.rust_target }}
          else
            npm run tauri -- build
          fi

      - name: List bundle artifacts
        if: always()
        shell: bash
        run: find "${{ matrix.bundle_dir }}" -type f | sort || echo "(bundle dir not found)"

      - name: Upload release artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.release_tag }}"
          BUNDLE="${{ matrix.bundle_dir }}"
          gh release upload "$TAG" \
            "$BUNDLE"/dmg/*.dmg \
            "$BUNDLE"/macos/*.app.tar.gz \
            "$BUNDLE"/macos/*.app.tar.gz.sig \
            --clobber

      - name: Upload release artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.release_tag }}"
          BUNDLE="${{ matrix.bundle_dir }}"
          shopt -s nullglob
          FILES=(
            "$BUNDLE"/appimage/*.AppImage
            "$BUNDLE"/appimage/*.AppImage.tar.gz
            "$BUNDLE"/appimage/*.AppImage.tar.gz.sig
            "$BUNDLE"/deb/*.deb
          )
          gh release upload "$TAG" "${FILES[@]}" --clobber

      - name: Upload release artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.release_tag }}"
          BUNDLE="${{ matrix.bundle_dir }}"
          gh release upload "$TAG" \
            "$BUNDLE"/msi/*.msi \
            "$BUNDLE"/msi/*.msi.sig \
            "$BUNDLE"/nsis/*-setup.exe \
            "$BUNDLE"/nsis/*-setup.exe.sig \
            --clobber

  updater-manifest:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
        run: |
          mkdir -p sigs
          gh release download "$RELEASE_TAG" --pattern "*.sig" --dir sigs --clobber

          python3 - <<'EOF'
          import json, os, re
          from datetime import datetime, timezone

          tag = os.environ['RELEASE_TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          def read_sig(name):
              return open(os.path.join('sigs', name)).read().strip()

          platforms = {}
          for sig_name in os.listdir('sigs'):
              asset_name = sig_name[:-4]  # strip .sig
              asset_url = f"{base_url}/{asset_name}"
              sig = read_sig(sig_name)
              if asset_name.endswith('_aarch64.app.tar.gz'):
                  platforms['darwin-aarch64'] = {'url': asset_url, 'signature': sig}
              elif asset_name.endswith('_x86_64.app.tar.gz'):
                  platforms['darwin-x86_64'] = {'url': asset_url, 'signature': sig}
              elif asset_name.endswith('.AppImage.tar.gz'):
                  platforms['linux-x86_64'] = {'url': asset_url, 'signature': sig}
              elif asset_name.endswith('.msi'):
                  platforms['windows-x86_64'] = {'url': asset_url, 'signature': sig}

          version = tag.lstrip('v')

          # Extract release notes from CHANGELOG.md
          notes_text = ''
          try:
              changelog = open('CHANGELOG.md').read()
              escaped = re.escape(version)
              match = re.search(rf'^## {escaped} [^\n]*\n(.*?)(?=\n## |\Z)', changelog, re.DOTALL)
              if match:
                  notes_text = match.group(1).strip()
          except FileNotFoundError:
              pass

          manifest = {
              'version': version,
              'notes': notes_text,
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms,
          }
          with open('latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(f"Generated latest.json v{version} — platforms: {sorted(platforms)}")
          EOF

          gh release upload "$RELEASE_TAG" latest.json --clobber
