[package]
name = "voxelle-desktop"
version = "0.2.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voxelle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ahash = "0.8"
arboard = "3"
bson = "2"
bytemuck = { version = "1.14", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1"
env_logger = "0.11"
flate2 = "1"
futures-util = "0.3"
glam = { version = "0.29", features = ["bytemuck"] }
glyphon = "0.7"
igd-next = { version = "0.17.0", features = ["aio_tokio"] }
local-ip-address = "0.6"
log = "0.4"
parking_lot = "0.12"
pollster = "0.3"
raw-window-handle = "0.6"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "test"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "sync",
] }
tokio-tungstenite = "0.24"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
wgpu = "23"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSColor",
    "NSWindow",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = [
    "NSUndoManager",
    "NSString",
    "NSObject",
    "block2",
] }
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "greedy_mesh"
harness = false

[[bench]]
name = "preview_generation"
harness = false
